[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-aware-task-router"
version = "0.1.0"
description = "Task routing system that queries real-time carbon intensity of the electricity grid and routes deferrable compute to low-intensity windows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
    "PyYAML>=6.0.1",
    "redis>=5.0.0",
    "python-dateutil>=2.9.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
    "mypy>=1.14.0",
    "bandit>=1.8.0",
    "pre-commit>=4.0.0",
    "types-PyYAML>=6.0.12",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
energy-router = "energy_router.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["energy_router"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B311"]
